name: test

on:
  push:
    branches: [main, codex-handoff-v2.6.0, packaging/windows-docker-v2.6.0]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q horde
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image
        run: docker build --pull -t linux-recon-horde:ci .
      - name: Start container
        run: |
          mkdir -p logs modules
          docker run -d --name horde-ci -p 8787:8787 \
            -v "$PWD/logs:/app/logs" \
            -v "$PWD/modules:/app/modules:ro" \
            linux-recon-horde:ci
      - name: Verify health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs horde-ci
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker logs horde-ci || true
      - name: Clean up
        if: always()
        run: docker rm -f horde-ci || true
