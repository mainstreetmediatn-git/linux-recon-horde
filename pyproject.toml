[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-recon-horde"
version = "0.1.0"
description = "Constitution-governed multi-agent reconnaissance framework for owned and explicitly authorized environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp[cli]>=2,<3",
    "pydantic>=2.8",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
horde = "horde.cli:main"
horde-server = "horde.local_engine.cli:main"
horde-mcp = "horde.mcp_gateway:main"

[tool.setuptools.packages.find]
include = ["horde*"]
exclude = ["instructions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
