[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-recon-horde"
version = "0.1.0"
description = "Constitution-governed multi-agent reconnaissance framework for owned and explicitly authorized environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
horde = "horde.cli:main"

[tool.setuptools.packages.find]
include = ["horde*"]
exclude = ["instructions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
